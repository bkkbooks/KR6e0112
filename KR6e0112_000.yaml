body:
  text: 釋華嚴十明論敘宋寶覺圓明禪師惠洪覺範撰顯謨閣待制朱公世英為余言頃過金陵謁王文公於鍾山公以彥里閈晚生有志學道謂曰若讀史見勾踐伍員事乎勾踐保栖會稽置膽於坐臥則仰膽飯食亦嘗膽也伍員去楚櫜載而去昭關至蒲伏行乞於吳市二子設心止欲雪恥復仇而焦身苦思二十餘年而後遂其欲蓋有志者事竟成也然移此心以學無上菩提其何以禦之世英囑豫記其言世英歿一年余還自海外築室筠溪石門寺夏釋此論追念平時之語曰嗟乎流轉三界未即棄去其恥亦大矣囚縛五陰未能超出其仇亦深矣以吳楚之仇恥較之其相倍如日劫而學者亦思掣肘徑去然至誠惻怛勇決力行較勾踐伍員特太山毫芒耳豈不惜哉金剛般若經須菩提聞世尊言以恆河沙等身命布施不如受持四句偈為他人説之福於是泣下其心豈不謂學者多以一身味著懈怠故自為障閡乎夫雜華具四天下微塵數偈而其所詮者如來普光明大智一法而已親近隨順此智者戒定慧三法而已以戒定慧觀照方便破滅無明一切衆生彈指實證故金剛藏菩薩曰隨順無明起諸有若不隨順諸有離是謂成佛顯訣人法要旨借令三世如來重復宣示深奧不能加毫末於此矣其於利害去取曉如白黑其義理昭著粲如日星不知學者於戒定慧何疑而不隨順於無明煩惱何戀而不棄遺乎孟軻曰今有無名之指屈而不信非疾痛害事也如有能信之者則不遠秦楚之路為指之不若人也指不若人則知惡之心不若人則不知惡此之謂不知類也今之知類者吾特未見耳豈密行暗證隱實顯玼世不得而知歟抑觀力麁浮習重境強多遇緣而退歟余切慕思大智者父子於道能遺虛名收實效三十年間決期現證皆獲宿智通入法華三昧乳中之酪此其驗矣嗚呼安得如南嶽天台兩人者與之增進此道哉政和五年六月十日書
